services:
  api:
    build: .
    command: uvicorn mmm.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

  worker:
    build: .
    command: celery -A mmm.worker.celery_app worker -Q training -n mmm-worker@%h --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
