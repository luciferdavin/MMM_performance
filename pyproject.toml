[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-platform"
version = "0.1.0"
description = "AI-powered Marketing Mix Modeling platform for agencies - optimize ad spend across channels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MMM Platform" }]
keywords = ["marketing mix modeling", "mmm", "bayesian", "budget allocation", "advertising", "pymc"]

dependencies = [
    # --- Modeling core ---
    "pymc>=5.19",
    "pymc-marketing>=0.11.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "polars>=1.0",

    # --- Pydantic models ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # --- HTTP / API clients ---
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.40",

    # --- CLI ---
    "click>=8.1",
    "rich>=13.7",

    # --- Plotting / reporting ---
    "matplotlib>=3.9",
    "plotly>=5.22",

    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",

    # --- Utils ---
    "python-dotenv>=1.0",
    "reportlab>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
api = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.9",
    "asyncpg>=0.30",

    # --- Async workers (Celery + Redis broker/backend) ---
    "celery>=5.4",
    "redis>=5.0",
]
worker = [
    "celery>=5.4",
    "redis>=5.0",
]

[project.scripts]
mmm = "mmm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
